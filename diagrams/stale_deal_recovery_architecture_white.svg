<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    .brand-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #ffffff; letter-spacing: -0.02em; }
    .brand-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
    .card-h { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13.5px; fill: #0f172a; }
    .card-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; line-height: 1.45; }
    .code-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #2563eb; }
    .code-tag-red { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #dc2626; }
    .code-tag-green { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #059669; }
    .step-pill { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 9.5px; fill: #ffffff; }
    .flow-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #64748b; }
  </style>

  <!-- Clean Canvas Background -->
  <rect width="1200" height="900" fill="#f8fafc" rx="14"/>
  <rect x="15" y="15" width="1170" height="870" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Hero Header Bar -->
  <g transform="translate(15, 15)">
    <rect width="1170" height="68" fill="url(#headerGrad)" rx="10 10 0 0"/>
    <rect x="28" y="18" width="32" height="32" rx="6" fill="#2563eb"/>
    <text x="44" y="39" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="14px" fill="#ffffff">SD</text>
    <text x="74" y="32" class="brand-title">Enterprise Stale Deal Recovery Architecture</text>
    <text x="74" y="52" class="brand-sub">PostgreSQL - Express API - BullMQ Inactivity Scanner - Auto-Task Generator - n8n AI Slack &amp; Email - React Console</text>
  </g>

  <!-- ==================== COLUMN 1: INGESTION & PIPELINE ==================== -->

  <!-- Box 1: React Enterprise CRM -->
  <g transform="translate(50, 105)">
    <rect width="250" height="135" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="250" height="4" fill="#2563eb" rx="8 8 0 0"/>
    <rect x="14" y="12" width="50" height="18" fill="#2563eb" rx="3"/>
    <text x="39" y="25" text-anchor="middle" class="step-pill">UI</text>
    <text x="72" y="26" class="card-h">React 18 Sales Dashboard</text>
    <text x="14" y="48" class="card-body">Interactive Pipeline &amp; Watchlist:</text>
    <text x="14" y="66" class="card-body">• 5-Stage Kanban Board</text>
    <text x="14" y="82" class="card-body">• 1-Click Re-engage Touchpoints</text>
    <text x="14" y="98" class="code-tag">Port 5177 (White Enterprise UI)</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 300 172 L 360 172" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="330" y="162" text-anchor="middle" class="flow-label">REST API</text>

  <!-- Box 2: Node.js / Express API -->
  <g transform="translate(365, 105)">
    <rect width="250" height="135" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="250" height="4" fill="#0f172a" rx="8 8 0 0"/>
    <rect x="14" y="12" width="50" height="18" fill="#0f172a" rx="3"/>
    <text x="39" y="25" text-anchor="middle" class="step-pill">API</text>
    <text x="72" y="26" class="card-h">Express Gateway (Port 5070)</text>
    <text x="14" y="48" class="card-body">Enforces CRM Business Logic:</text>
    <text x="14" y="66" class="code-tag">POST /deals/:id/touch</text>
    <text x="14" y="82" class="code-tag">PATCH /tasks/:id/complete</text>
    <text x="14" y="98" class="code-tag">POST /webhooks/stale-scan</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 615 172 L 675 172" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
  <text x="645" y="162" text-anchor="middle" class="flow-label">Persist</text>

  <!-- Box 3: PostgreSQL / DataStore -->
  <g transform="translate(680, 105)">
    <rect width="230" height="135" fill="#ffffff" stroke="#059669" stroke-width="1.5" rx="8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="230" height="4" fill="#059669" rx="8 8 0 0"/>
    <rect x="14" y="12" width="50" height="18" fill="#059669" rx="3"/>
    <text x="39" y="25" text-anchor="middle" class="step-pill">DB</text>
    <text x="72" y="26" class="card-h">PostgreSQL Source of Truth</text>
    <text x="14" y="48" class="card-body">Tables &amp; Schemas:</text>
    <text x="14" y="66" class="code-tag-green">• deals (last_activity_at)</text>
    <text x="14" y="82" class="code-tag-green">• tasks (auto-generated)</text>
    <text x="14" y="98" class="code-tag-green">• activities (timeline audit)</text>
  </g>

  <!-- Flow 3 -> 4 (BullMQ Queue) -->
  <path d="M 910 172 L 965 172" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="938" y="162" text-anchor="middle" class="flow-label" fill="#dc2626">Hourly Job</text>

  <!-- Box 4: BullMQ + Redis -->
  <g transform="translate(970, 105)">
    <rect width="180" height="135" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" rx="8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="180" height="4" fill="#dc2626" rx="8 8 0 0"/>
    <rect x="14" y="12" width="50" height="18" fill="#dc2626" rx="3"/>
    <text x="39" y="25" text-anchor="middle" class="step-pill">CRON</text>
    <text x="72" y="26" class="card-h" fill="#991b1b">BullMQ Engine</text>
    <text x="14" y="48" class="card-body" fill="#991b1b">Scheduled Inactivity:</text>
    <text x="14" y="66" class="code-tag-red">• Hourly Scanner</text>
    <text x="14" y="82" class="code-tag-red">• Non-blocking queue</text>
    <text x="14" y="98" class="code-tag-red">• Zero cron drift</text>
  </g>

  <!-- ==================== ROW 2: STALE DETECTION & AUTO-TASK ==================== -->

  <!-- Flow down to Evaluation -->
  <path d="M 1060 240 L 1060 280 L 600 280 L 600 310" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="800" y="272" text-anchor="middle" class="flow-label" fill="#dc2626" font-weight="700">Find Open Deals: status != 'closed' AND last_activity &lt;= NOW() - 7 Days</text>

  <!-- Stale Evaluator Big Box -->
  <g transform="translate(50, 320)">
    <rect width="1100" height="165" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="10" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="1100" height="5" fill="#dc2626" rx="10 10 0 0"/>
    <rect x="16" y="14" width="54" height="20" fill="#dc2626" rx="4"/>
    <text x="43" y="28" text-anchor="middle" class="step-pill">ENGINE</text>
    <text x="80" y="29" class="card-h" font-size="15px" fill="#991b1b">Stale Deal Detection &amp; Auto-Task Generation Subsystem</text>

    <g transform="translate(16, 45)">
      <!-- Sub-Box 1: Inactivity Rule -->
      <g transform="translate(0, 0)">
        <rect width="335" height="102" fill="#fff5f5" stroke="#fed7d7" rx="6"/>
        <text x="12" y="22" class="card-h" font-size="12.5px" fill="#991b1b">1. 7-Day Inactivity Check</text>
        <text x="12" y="42" class="card-body" fill="#991b1b">• Compares lastActivityAt against Date.now()</text>
        <text x="12" y="60" class="card-body" fill="#991b1b">• Flags isStale: true &amp; records staleFlaggedAt</text>
        <text x="12" y="80" class="code-tag-red">deals.isStale = true</text>
      </g>

      <!-- Sub-Box 2: Auto-Task Generator -->
      <g transform="translate(355, 0)">
        <rect width="355" height="102" fill="#eff6ff" stroke="#bfdbfe" rx="6"/>
        <text x="12" y="22" class="card-h" font-size="12.5px" fill="#1e40af">2. Auto-Task Generator</text>
        <text x="12" y="42" class="card-body" fill="#1e40af">• Generates actionable task assigned to Deal Owner</text>
        <text x="12" y="60" class="card-body" fill="#1e40af">• Sets priority based on deal size ($100k+ = URGENT)</text>
        <text x="12" y="80" class="code-tag">tasks.create({ dealId, priority: 'HIGH' })</text>
      </g>

      <!-- Sub-Box 3: Notification Dispatcher -->
      <g transform="translate(730, 0)">
        <rect width="338" height="102" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
        <text x="12" y="22" class="card-h" font-size="12.5px">3. Dispatcher Gateway</text>
        <text x="12" y="42" class="card-body">• Triggers n8n AI recovery webhook</text>
        <text x="12" y="60" class="card-body">• Dispatches email alert to Rep from GMAIL_USER</text>
        <text x="12" y="80" class="code-tag">emailService.sendStaleDealAlert()</text>
      </g>
    </g>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 600 485 L 600 525" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="610" y="508" class="flow-label" fill="#2563eb">Handoff to Integrations &amp; Sales Representatives</text>

  <!-- ==================== ROW 3: N8N AUTOMATION & SALES OUTREACH ==================== -->

  <g transform="translate(50, 530)">
    <rect width="1100" height="160" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" rx="10" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="1100" height="4" fill="#2563eb" rx="10 10 0 0"/>
    <rect x="16" y="14" width="54" height="20" fill="#2563eb" rx="4"/>
    <text x="43" y="28" text-anchor="middle" class="step-pill">RECOVERY</text>
    <text x="80" y="29" class="card-h" font-size="14.5px">n8n Orchestration &amp; Sales Representative Touchpoint</text>

    <g transform="translate(16, 45)">
      <!-- n8n Node 1 -->
      <g transform="translate(0, 0)">
        <rect width="255" height="98" fill="#faf5ff" stroke="#e9d5ff" rx="6"/>
        <text x="12" y="22" class="card-h" font-size="12px" fill="#6b21a8">n8n Slack Alert</text>
        <text x="12" y="42" class="card-body" fill="#6b21a8">Posts to #stale-deals-recovery</text>
        <text x="12" y="60" class="card-body" fill="#6b21a8">Shows deal $, days untouched &amp; rep</text>
        <text x="12" y="78" class="code-tag">Channel: #stale-deals</text>
      </g>

      <!-- n8n Node 2 -->
      <g transform="translate(270, 0)">
        <rect width="255" height="98" fill="#eff6ff" stroke="#bfdbfe" rx="6"/>
        <text x="12" y="22" class="card-h" font-size="12px" fill="#1e40af">AI Recovery Email Drafter</text>
        <text x="12" y="42" class="card-body" fill="#1e40af">Generates personalized re-engagement copy</text>
        <text x="12" y="60" class="card-body" fill="#1e40af">Value props, ROI audits &amp; discount hooks</text>
        <text x="12" y="78" class="code-tag">Google Gemini 1.5 Flash</text>
      </g>

      <!-- Rep Touchpoint -->
      <g transform="translate(540, 0)">
        <rect width="255" height="98" fill="#ecfdf5" stroke="#a7f3d0" rx="6"/>
        <text x="12" y="22" class="card-h" font-size="12px" fill="#065f46">Rep Touchpoint Executed</text>
        <text x="12" y="42" class="card-body" fill="#065f46">Rep calls or emails prospect</text>
        <text x="12" y="60" class="card-body" fill="#065f46">Clicks 'Re-engage &amp; Clear' in UI</text>
        <text x="12" y="78" class="code-tag-green">POST /deals/:id/touch</text>
      </g>

      <!-- Resolution -->
      <g transform="translate(810, 0)">
        <rect width="258" height="98" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
        <text x="12" y="22" class="card-h" font-size="12px">Automatic Resolution</text>
        <text x="12" y="42" class="card-body" fill="#059669">✅ Removes STALE Flag</text>
        <text x="12" y="60" class="card-body" fill="#059669">✅ Resolves Auto-Task</text>
        <text x="12" y="78" class="card-body" fill="#dc2626">⚠️ Or Escalates to VP if ignored</text>
      </g>
    </g>
  </g>

  <!-- Bottom Footer Note -->
  <g transform="translate(50, 715)">
    <rect width="1100" height="40" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
    <text x="550" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11.5px" font-weight="600" fill="#475569">
      Hygiene Guarantee: Pipeline is continuously audited every hour. Deals untouched ≥ 7 days generate instant tasks until re-engaged.
    </text>
  </g>
</svg>
